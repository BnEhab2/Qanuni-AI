<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep dark tech luxury -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </linearGradient>
    <!-- Accent Gradient: Gold/Bronze premium justice color -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="100%" stop-color="#0d7f62" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#3c3c3c" stroke-width="12" />
  
  <!-- Scale Icon (Mizan) in Center -->
  <g transform="translate(64, 64) scale(16)" filter="url(#glow)">
    <!-- Scale Path matching the welcome logo -->
    <path d="M16 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1zM7 21h10M12 2v19M20 7H4"
          fill="none" stroke="url(#accentGrad)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
